auto_merge: false
branch_protection: false
# pytest walks every ancestor conftest at collection time; redrobot's root one
# imports numpy, which the meta-tests job does not install. Cutting discovery at
# tests/ci is safe here (no tests/ci/conftest.py) but is NOT safe everywhere —
# jarvis's root conftest seeds sys.path for its other suites (#1406).
ci_meta_pytest_args: --confcutdir=tests/ci
ci_language: python
# The issue forms are canonically *delivered* (#940 AC3) but their content is
# redrobot's own Component/area:* vocabulary, which its issue-schema-check.yml
# already enforces — writing jarvis's canon vocabulary over them would red that
# gate on the first sync. REPO_CUSTOM is the only lever that expresses "deliver
# once, then hands off" today; the per-repo issue-template content axis that
# would let canon own the shape while redrobot owns the options is #1411
# (decision f62279a8-5e98-4e32-a3dd-fb2542767b80).
custom_files:
- .github/workflows/pytest.yml
- .github/ISSUE_TEMPLATE/bug.yml
- .github/ISSUE_TEMPLATE/task.yml
- .github/ISSUE_TEMPLATE/config.yml
dependabot_ecosystems: []
# minimal profile's managed_files omits community-health (right for Osasuwu repos,
# which get it from the Osasuwu/.github fallback — decision 261937d0). redrobot is
# cross-account so that fallback can't reach it; #940 AC3 requires it written here
# locally. code-review.yml stays excluded — canon vs. live has an open gap (#1304)
# that would regress redrobot's existing gating steps if overwritten now. The
# ISSUE_TEMPLATE/* forms are community-health too but sit in custom_files above,
# for the vocabulary reason recorded there.
managed_files:
- .github/workflows/owner-queue-guard.yml
- .github/workflows/pr-body-check.yml
- .github/workflows/ci-meta.yml
- .github/dependabot.yml
- .github/PULL_REQUEST_TEMPLATE.md
profile: minimal
repo: SergazyNarynov/redrobot
required_check_contexts: []
visibility: private
