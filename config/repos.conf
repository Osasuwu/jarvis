# Repositories tracked by Jarvis for daily triage.
# One owner/repo per line. Lines starting with # are comments.
#
# Write-action policy (enforced by skills, not this file):
#   - Repos under "Osasuwu/*"        → auto-actionable (autonomous-loop may close
#                                       orphan milestones, attach sprints, etc.)
#   - "special-class" repos (owner personally authorized the bot to manage
#     as its own — e.g. redrobot) → auto-actionable within the authorized
#     scope; writes needing elevated credentials (repo settings, branch
#     protection) still require the owner's own token.
#   - All other owners               → flag-only / read (proposal recorded in
#                                       memory, owner executes manually)
#
# Local path is resolved as {device.json.repos_path}/{repo-name}.
#
# Optional trailing tokens (unknown tokens are forward-compat tolerated —
# see scripts/repos_conf.py):
#   project=N        binds the repo to a GitHub Projects v2 board (USER-owned,
#                     project number N) so the stale-backlog detector (#1059)
#                     can read each issue's Status field. Omit for repos
#                     without a board.
#   releases=weekly   opts the repo into /weekly-release's scheduled draft run.
#   lang=ru,en        release-note languages to generate (comma-separated).

Osasuwu/jarvis project=3 releases=weekly lang=ru,en
Osasuwu/music-intel-mcp releases=weekly lang=ru,en
Osasuwu/like_spotify_mobile_app
Osasuwu/dnd-calendar
