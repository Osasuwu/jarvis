slots: ["slot-1", "slot-2"]

# Dedicated docker network for the container substrate (#1121 step 13).
# Segmentation only — the container can't reach other containers/services
# sitting on the default bridge network. This is NOT egress filtering:
# outbound internet access from the container is unaffected. Created via
# `docker network create sandcastle-jarvis` on the host before first run;
# main.mts's docker() sandbox call passes this through as its `network`
# option (mattpocock/sandcastle's docker sandbox --network passthrough).
network: sandcastle-jarvis

# Billing-key denylist consumed by BOTH .sandcastle/main.mts (TS, subscription
# auth-mode guard) and agents/sandcastle_config.py (Python, spawn-env guard) —
# single shared config source, not two independently-maintained checks
# (decision 70f25333-b4f4-454e-903b-ab2d32b125c8, #1121).
billing_key_denylist:
  - ANTHROPIC_BASE_URL
  - ANTHROPIC_AUTH_TOKEN
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_USE_BEDROCK
  - CLAUDE_CODE_USE_VERTEX
  - CLAUDE_CODE_USE_FOUNDRY

# Per-row tier-aware quota gate (decision cc5f9c2c-4371-4cec-bd54-79b7163c398c,
# #1121): a throttled row is skipped at drain time, never halts the drain.
quota_gate:
  enabled: true

# Default substrate for a queue row with no explicit substrate value — rows
# created before this slice, or enqueued by a caller that hasn't been updated
# to stamp substrate="worktree" yet (decision c5e2e14a, #1121 plan step 7).
# Only "worktree" is routable this slice; "container" is reserved for the
# #1121 follow-up issue and must not be set here.
operator_default_substrate: worktree

# Task sweeper tunables (#1122 AC11) — the primary closer of `running` rows.
# No sweeper literal may live on a code path; everything the sweeper needs
# comes from here.
sweeper:
  run_timeout_hours: 4
  destructive_min_age_minutes: 10
  daemon_failure_threshold: 3
  docker_call_timeout_seconds: 30
  runtime_root: .sandcastle/runtime
