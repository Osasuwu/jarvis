# Scheduled CI runs read every morning by scripts/scheduled_ci_reader.py (#2225).
#
# One watched workflow per line:
#
#   owner/repo workflow-file [event=<name>]
#
# `workflow-file` is the file name under .github/workflows/. `event` is the
# trigger whose runs are read; it defaults to `schedule`, so push and PR runs of
# the same workflow are left to the PR that caused them.
#
# Adding a scheduled check to the reader is one new line here. What the reader
# does with a red run: docs/reference/scheduled-ci-reader.md.

