version: 2
updates:
  # Python dependencies (root pyproject.toml + uv.lock) (#1313)
  # Dependabot updates the ranges in pyproject.toml; uv.lock is NOT
  # regenerated by CI. CI only verifies parity (`uv lock --check` in the
  # lockfile-check job) and fails if uv.lock is stale — regenerate it
  # manually per SETUP.md "Lockfile regeneration" and commit it alongside
  # the bump.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: main

  # Python dependencies (MCP memory server: requirements.txt + uv.lock) (#1313)
  # Dependabot updates the ranges in requirements.txt/pyproject.toml; uv.lock
  # is NOT regenerated by CI — same manual step as above, see SETUP.md.
  - package-ecosystem: pip
    directory: "/mcp-memory"
    schedule:
      interval: weekly
      day: monday
    target-branch: main

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: main
