name: Event Dispatch

# Captures critical GitHub events and writes them to Supabase events table.
# The reactive-core orchestrator (wake_driver → agents/orchestrator router)
# consumes pending events and routes each to inline / task_queue / escalation.
#
# Required secrets:
#   SUPABASE_URL      — project URL (https://xxx.supabase.co)
#   SUPABASE_ANON_KEY — publishable anon key
#
# To add this to another repo (e.g. redrobot):
#   1. Copy this file to .github/workflows/event-dispatch.yml
#   2. Add the same SUPABASE_URL and SUPABASE_ANON_KEY secrets
#   3. Events from all repos land in the same events table

on:
  workflow_run:
    workflows:
      - "Gitleaks Secret Scanning"
      - "PR Body Check"
      - "PR Merged"
      - "Project Sync"
      - "Review Response"
    types: [completed]
    branches: [main]

  pull_request:
    types: [closed]
    branches: [main]

  pull_request_review:
    types: [submitted]

  # ── For Claude code-review bot's issue-comment verdicts (#633) ────
  # The bot posts review findings as a PR-issue comment (not via the
  # pull_request_review surface). This trigger lets us parse the verdict
  # and emit a canonical review_negative event from one place.
  issue_comment:
    types: [created]

jobs:
  # ── CI Failure on default branch ──────────────────────────────────
  ci-failure:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI failure event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          URL="${{ github.event.workflow_run.html_url }}"

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"event_type\": \"ci_failure\",
              \"severity\": \"high\",
              \"repo\": \"${REPO}\",
              \"source\": \"github_action\",
              \"title\": \"CI failed: ${WORKFLOW} on ${BRANCH}\",
              \"payload\": {
                \"workflow\": \"${WORKFLOW}\",
                \"run_id\": ${RUN_ID},
                \"branch\": \"${BRANCH}\",
                \"sha\": \"${SHA}\",
                \"url\": \"${URL}\"
              },
              \"event_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"

  # ── PR Approved ───────────────────────────────────────────────────
  pr-approved:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PR approved event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          REVIEWER="${{ github.event.review.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg title "PR #${PR_NUM} approved by ${REVIEWER}" \
            --argjson pr_number "$PR_NUM" \
            --arg pr_title "$PR_TITLE" \
            --arg reviewer "$REVIEWER" \
            --arg url "$PR_URL" \
            --arg event_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event_type: "pr_approved",
              severity: "info",
              repo: $repo,
              source: "github_action",
              title: $title,
              payload: {
                pr_number: $pr_number,
                pr_title: $pr_title,
                reviewer: $reviewer,
                url: $url
              },
              event_at: $event_at
            }')

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"

  # ── PR Merged ─────────────────────────────────────────────────────
  pr-merged:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PR merged event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg title "PR #${PR_NUM} merged: ${PR_TITLE}" \
            --argjson pr_number "$PR_NUM" \
            --arg pr_title "$PR_TITLE" \
            --arg author "$AUTHOR" \
            --arg merge_sha "$MERGE_SHA" \
            --arg url "$PR_URL" \
            --arg event_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event_type: "pr_merged",
              severity: "info",
              repo: $repo,
              source: "github_action",
              title: $title,
              payload: {
                pr_number: $pr_number,
                pr_title: $pr_title,
                author: $author,
                merge_sha: $merge_sha,
                url: $url
              },
              event_at: $event_at
            }')

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"

  # ── CI Success on default branch (all checks passed) ─────────────
  ci-success:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI success event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          URL="${{ github.event.workflow_run.html_url }}"

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"event_type\": \"ci_success\",
              \"severity\": \"low\",
              \"repo\": \"${REPO}\",
              \"source\": \"github_action\",
              \"title\": \"CI passed: ${WORKFLOW} on ${BRANCH}\",
              \"payload\": {
                \"workflow\": \"${WORKFLOW}\",
                \"branch\": \"${BRANCH}\",
                \"url\": \"${URL}\"
              },
              \"event_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"

  # ── Review Negative: Human ────────────────────────────────────────
  # Emits a canonical review_negative row when a human reviewer requests
  # changes on an internal PR. Consumed by the orchestrator watcher
  # (scripts/orchestrator/watcher.py) — see PR #755 / issue #639 / PRD #41.
  #
  # Filter: state == 'changes_requested' only (the "request changes" signal).
  # 'commented' state carries no verdict and intentionally does NOT fire here.
  review-negative-human:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.type == 'User' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch review_negative event (human)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          REVIEWER="${{ github.event.review.user.login }}"
          REVIEW_ID="${{ github.event.review.id }}"
          REVIEW_URL="${{ github.event.review.html_url }}"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg title "PR #${PR_NUM} changes requested by ${REVIEWER}" \
            --argjson pr_number "$PR_NUM" \
            --arg pr_title "$PR_TITLE" \
            --arg reviewer "$REVIEWER" \
            --argjson review_id "$REVIEW_ID" \
            --arg review_url "$REVIEW_URL" \
            --arg event_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event_type: "review_negative",
              severity: "medium",
              repo: $repo,
              source: "github_action",
              title: $title,
              payload: {
                pr_number: $pr_number,
                pr_title: $pr_title,
                reviewer_kind: "human",
                reviewer: $reviewer,
                review_id: $review_id,
                review_url: $review_url
              },
              event_at: $event_at
            }')

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"

  # ── Review Negative: Claude code-review bot ───────────────────────
  # The Layer B reviewer (#1816) posts its verdict as an issue-comment
  # carrying a structured `<!-- code-review-findings -->` JSON block, not via
  # pull_request_review. This job parses the verdict here in CI — the only
  # fragile string-match in the system per PRD #41 — so the orchestrator's
  # filter stays `event_type = 'review_negative'`, one stable predicate.
  #
  # Two-gate alignment (#992, re-grounded on the {blocking, findings} shape by
  # #1816): the BLOCKING predicate here is identical to the MERGE gate's
  # verdict step in code-review.yml — structured marker authoritative in both
  # directions, fail-closed on a malformed/legacy marker, legacy prose-heading
  # fallback only when no marker is present at all (older comments predating
  # #1816). Keeping the event-side trigger and the merge gate on the same
  # predicate is the whole point: a PR the merge gate blocks is exactly a PR
  # that raises review_negative, and vice-versa.
  #
  # Legacy plugin output shapes (pre-#1816, still handled by the prose
  # fallback): severity sections were all-caps headings — `### MAJOR`,
  # `### MAJOR findings`, `### 🔴 BLOCKING` (decoration/suffix vary,
  # #954/#956/#957). `No issues found.` / `### Blocking issues — None` (#962) /
  # MINOR-only sections (#963) are non-blocking → no emit. Title may deviate
  # from the literal `### Code review` (e.g. `## Claude Code Review — PR #957`),
  # so the selector matches `(Claude )?Code Review` on any line, case-insensitive.
  #
  # `findings` (the structured verdict's array, `[]` on the legacy fallback
  # path) and `finding_fingerprint` (a sorted, deduped `class|file` array
  # computed ONLY from that structured array, never from LLM prose) replace
  # the old n_critical/n_major/n_minor integer counts (#1816 plan step 14): a
  # repo-wide grep found no consumer of those fields beyond
  # scripts/rework_policy.py itself, which step 11 moves onto the fingerprint
  # model — so the counts are dropped rather than carried as dead back-compat.
  review-negative-claude-bot:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Parse Claude verdict and dispatch event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Read comment body from the event payload (safe — no shell expansion of comment content)
          COMMENT_BODY="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"

          # Force the C locale for every grep below. The severity-heading greps
          # classify decoration bytes with POSIX [^[:alnum:]]; under the runner's
          # default LANG=C.UTF-8 a multibyte emoji ("### 🔴 BLOCKING", #954) is one
          # rune that [^[:alnum:]] won't consume, so a genuinely blocking review
          # fails to raise review_negative — diverging from the merge gate this
          # parser is meant to mirror (#992). C locale makes grep byte-oriented so
          # the emoji decoration matches. Set after jq so JSON stays UTF-8 aware.
          export LC_ALL=C

          # Only act on the Claude code-review verdict comment. claude[bot]
          # posts other comment kinds (simplification opportunities, /rework
          # progress, orchestrator-watcher dispatches). Mirror the SAME title
          # selector the merge-gate verdict step uses (code-review.yml): a
          # heading "(Claude )?Code Review" on any line, case-insensitive —
          # NOT an exact "### Code review" first line. Deviant titles like
          # "## Claude Code Review — PR #957" (#957) must still reach severity
          # detection, else a blocking review with a deviant title silently
          # fails to raise review_negative (#992 consequence 2). grep is line-
          # anchored, so a bare `^` is the line-start equivalent of the merge
          # gate's `(^|\n)`.
          if ! grep -qiE '^#{1,6}[ \t]*(Claude[ \t]+)?Code[ \t]+Review' <<<"$COMMENT_BODY"; then
            echo "Not a Code review verdict comment; skipping"
            exit 0
          fi

          # #1816: structured {blocking, findings} marker is authoritative in
          # both directions (mirrors scripts/review_debt_collector.py's
          # has_blocking_finding() and code-review.yml's "Verify review
          # verdict" step byte-for-byte). Marker absent entirely → fall back
          # to the legacy prose severity-heading check for older comments.
          FINDINGS_JSON="[]"
          if grep -q '<!-- *code-review-findings' <<<"$COMMENT_BODY"; then
            findings_block=$(sed -n '/<!-- *code-review-findings/,/-->/p' <<<"$COMMENT_BODY" | sed '1d;$d')
            if ! jq -e . >/dev/null 2>&1 <<<"$findings_block"; then
              echo "code-review-findings block present but payload is not valid JSON; failing closed (#1816)"
              BLOCKING=true
            else
              blocking_type=$(jq -r 'if (.blocking | type) == "boolean" then "ok" else "bad" end' <<<"$findings_block")
              findings_type=$(jq -r 'if (.findings | type) == "array" then "ok" else "bad" end' <<<"$findings_block")
              if [ "$blocking_type" != "ok" ] || [ "$findings_type" != "ok" ]; then
                echo "code-review-findings block malformed (blocking/findings missing or wrong type); failing closed (#1816)"
                BLOCKING=true
              else
                BLOCKING=$(jq -r '.blocking' <<<"$findings_block")
                if [ "$BLOCKING" = "true" ]; then
                  FINDINGS_JSON=$(jq -c '.findings' <<<"$findings_block")
                fi
              fi
            fi
          else
            # Two-gate model (#988/#992): emit review_negative ONLY on a real
            # merge-blocking finding — an all-caps CRITICAL/MAJOR/BLOCKING/MEDIUM
            # severity heading (case-SENSITIVE), the SAME legacy predicate the
            # MERGE gate falls back to in code-review.yml. MINOR excluded —
            # minors never block (swept in-context by /rework, not a gate).
            if grep -qE '^#{1,6}[^[:alnum:]]*(CRITICAL|MAJOR|BLOCKING|MEDIUM)\b' <<<"$COMMENT_BODY"; then
              BLOCKING=true
            else
              BLOCKING=false
            fi
          fi

          if [ "$BLOCKING" != "true" ]; then
            echo "Verdict is not blocking; not emitting review_negative"
            exit 0
          fi

          # finding_fingerprint: a sorted, deduped "class|file" array computed
          # ONLY from the structured findings array, never from LLM prose
          # (#1816 plan step 13) — empty on the legacy prose-fallback path,
          # since no per-finding class/file is available there.
          FINGERPRINT_JSON=$(jq -c '[.[] | "\(.class)|\(.file)"] | unique' <<<"$FINDINGS_JSON")
          N_ISSUES=$(jq 'length' <<<"$FINDINGS_JSON")

          REPO="${{ github.repository }}"
          PR_NUM="${{ github.event.issue.number }}"
          PR_TITLE="${{ github.event.issue.title }}"
          COMMENT_ID="${{ github.event.comment.id }}"
          COMMENT_URL="${{ github.event.comment.html_url }}"

          ISSUE_WORD="issues"
          if [ "$N_ISSUES" -eq 1 ]; then ISSUE_WORD="issue"; fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg title "PR #${PR_NUM} — Claude code-review: ${N_ISSUES} ${ISSUE_WORD}" \
            --argjson pr_number "$PR_NUM" \
            --arg pr_title "$PR_TITLE" \
            --argjson comment_id "$COMMENT_ID" \
            --arg comment_url "$COMMENT_URL" \
            --argjson n_issues "$N_ISSUES" \
            --argjson findings "$FINDINGS_JSON" \
            --argjson finding_fingerprint "$FINGERPRINT_JSON" \
            --arg event_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event_type: "review_negative",
              severity: "medium",
              repo: $repo,
              source: "github_action",
              title: $title,
              payload: {
                pr_number: $pr_number,
                pr_title: $pr_title,
                reviewer_kind: "claude_bot",
                comment_id: $comment_id,
                comment_url: $comment_url,
                n_issues: $n_issues,
                findings: $findings,
                finding_fingerprint: $finding_fingerprint
              },
              event_at: $event_at
            }')

          curl -s -X POST "${SUPABASE_URL}/rest/v1/events" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"
