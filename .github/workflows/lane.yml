name: Lane

# The AFK lane as a reusable workflow (#2013, D2, D16). A host repo runs it
# through a thin caller (`issues: labeled`) pinned to a jarvis commit SHA; the
# caller carries the host's identity and secrets and none of the lane logic.
# Inside a called workflow the `github` context is the CALLER's: its repository,
# its event payload, its `github.sha`. That is what makes the concurrency group
# below per host repo, and why the jarvis code each job runs is fetched by
# `job.workflow_repository` / `job.workflow_sha` (the lane's own repository and
# commit) into `.lane-src` instead of read from the host checkout.
#
# The worker runs once per `agent:dispatch` label-add, and only after the
# `intake` job lets the issue through. The caller's WORKFLOW still starts on
# every label-add: `issues: labeled` has no label filter, so the job conditions
# below narrow it to the one label this workflow reacts to. Other-label churn
# on the same issue produces a run whose jobs are all skipped, never a worker
# run. The label literal lives here only, so the caller job is unconditional.
on:
  workflow_call:
    inputs:
      bot-login:
        description: Login of the lane bot account (D1); the author of every commit and PR the lane writes.
        type: string
        required: true
      bot-email:
        description: The bot's noreply commit address (`<id>+<login>@users.noreply.github.com`).
        type: string
        required: true
      model:
        description: Model id passed to the worker as `--model`; a fixed axis of the N-run gate (D13, F3).
        type: string
        required: true
      operator:
        description: Login @-mentioned when a run or PR needs a human (D14); empty means no mention.
        type: string
        default: ""
      ledger-issue:
        description: "Tracking issue of the N-run gate ledger as `owner/repo#N`; empty means no ledger."
        type: string
        default: ""
      ledger-smoke-issue:
        description: While this checkpoint issue is open, ledger rows are `smoke` and never counted.
        type: string
        default: ""
      class2-afk:
        description: Whether `afk:2-plan` issues may run AFK in this host (D17); off unless the caller sets it.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_DISPATCH_PAT:
        required: true

# One worker per host repo at a time (D15, F7 in docs/decisions/2026-Q4.md):
# the group is per repository, and `queue: max` keeps up to 100 pending runs
# instead of the default `queue: single`, which cancels the older pending run
# — a three-issue batch would lose its middle run with no artifact. A retry
# (removing `agent:dispatch` and re-applying it, per dispatch/SKILL.md's
# recovery note) therefore waits its turn rather than cancelling the run in
# flight, and intake then refuses it while the issue is still `status:in-progress`
# or `needs-human` (D8, D14). `cancel-in-progress` is stated as `false`
# (#2011) because a re-dispatch must never cancel a worker; `queue: max`
# rejects only `cancel-in-progress: true`.
#
# The group key depends on the label, not just the repo (#1936).
# Workflow-level concurrency is resolved when the run is queued, BEFORE the
# job `if` below is evaluated, so a group keyed on the repo alone would make
# every label event on any issue wait behind a running worker. Non-dispatch
# events therefore get a group unique to their own run (`github.run_id`, the
# fallback GitHub's concurrency docs use for the same purpose), which nothing
# else can ever join — they can neither queue behind nor block a worker.
#
# Callers declare no `concurrency` of their own: a caller group equal to this
# one deadlocks. Under `workflow_call`, `github.repository` is the host's, so
# two dispatches in one host queue here and different hosts never share a group.
#
# Kept at workflow level rather than moved onto the job: whether a job-level
# `concurrency` is applied before or after that job's `if` is not documented,
# and this form does not depend on the answer.
concurrency:
  group: ${{ github.event.label.name == 'agent:dispatch' && format('agent-dispatch-{0}', github.repository) || format('agent-dispatch-noop-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  # Deterministic gate in front of the worker (D6, D8, D9): refuses unless the
  # issue body is the one the human labelled, a class label is on it, and
  # nothing already claims it; an `afk:2-plan` issue also needs a `## Plan`
  # whose lock verifies (D5). A refusal leaves one issue comment naming the
  # rule and the worker never starts; a pass swaps `agent:dispatch` for
  # `status:in-progress`. Rules and rationale: .github/scripts/lane_intake.py.
  #
  # Default GITHUB_TOKEN with no checkout of the issue's content: the job
  # runs lane code from the pinned lane commit only (the gate script and
  # `agents/plan_lock.py`, which it imports), never anything the issue body
  # supplies, and its writes are a comment and two labels.
  intake:
    if: github.event.label.name == 'agent:dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      pass: ${{ steps.intake.outputs.pass }}
    steps:
      # The lane's own code (scripts, `agents/`) at the lane's own commit, never
      # the host's: `job.workflow_repository` / `job.workflow_sha` name the
      # repository and commit of THIS file. A wrong value leaves `.lane-src`
      # without the script and the run step below fails with "No such file".
      - name: Check out the lane code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lane-src
          sparse-checkout: |
            .github/scripts
            agents
          persist-credentials: false

      # An empty `job.workflow_sha` would make the checkout above silently take
      # the lane repository's default branch, i.e. unpinned code. Fail instead.
      - name: Verify the lane code is at the pinned commit
        env:
          LANE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$LANE_SHA"
          test "$(git -C .lane-src rev-parse HEAD)" = "$LANE_SHA"

      - name: Run lane intake
        id: intake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAYLOAD_BODY: ${{ github.event.issue.body }}
          # `afk:2-plan` runs AFK only where the caller turns it on, and only
          # until the N-run gate passes (D17); a caller that leaves the input
          # off gets a refusal.
          LANE_CLASS2_AFK: ${{ inputs.class2-afk }}
          LANE_BOT_LOGIN: ${{ inputs.bot-login }}
        run: python3 .lane-src/.github/scripts/lane_intake.py

  # The worker holds no token that can write (D4). Its GITHUB_TOKEN is
  # read-only and the bot PAT never enters this job, so a push, a PR, a comment
  # or a label attempt from here fails at GitHub rather than at a prompt rule.
  # What it leaves behind is data: `lane-out/work.bundle` (its commits) and
  # `lane-out/pr-body.md` (its PR description), handed to the `publish` job as
  # an artifact. Nothing the worker produces is executed downstream.
  worker:
    needs: intake
    if: needs.intake.outputs.pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # How the worker ended, for the `escalate` job (#2011); empty when the
    # execution log is absent.
    outputs:
      result_subtype: ${{ steps.ending.outputs.result_subtype }}
      num_turns: ${{ steps.ending.outputs.num_turns }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # `lane-out/` is the worker's hand-off directory. It sits in the workspace
      # because headless Write is scoped there, and it is excluded from git so
      # the worker's `git add` cannot sweep its own PR description into a commit.
      - name: Prepare the hand-off directory
        run: |
          mkdir -p lane-out
          echo "lane-out/" >> .git/info/exclude

      # The N-run gate counts a PR as unedited only when every commit on it is
      # authored by the bot (D13), so the worker's commits must carry that
      # identity. Environment variables rather than `git config`: they win over
      # any config the action or the worker writes. The noreply address is what
      # GitHub maps back to the account, so the commit's author login reads as
      # the bot's login. Both come from the caller's inputs, through `env` so no
      # input is interpolated into the script text.
      - name: Commit as the bot
        env:
          BOT_LOGIN: ${{ inputs.bot-login }}
          BOT_EMAIL: ${{ inputs.bot-email }}
        run: |
          {
            echo "GIT_AUTHOR_NAME=${BOT_LOGIN}"
            echo "GIT_AUTHOR_EMAIL=${BOT_EMAIL}"
            echo "GIT_COMMITTER_NAME=${BOT_LOGIN}"
            echo "GIT_COMMITTER_EMAIL=${BOT_EMAIL}"
          } >> "$GITHUB_ENV"

      # The worker's test toolchain (#1951): the `pytest` job's environment in
      # pytest.yml, installed from the lockfile before the model starts, so the
      # `python -m pytest` and `ruff` grants below have something to run and the
      # worker can do the mutation probe test-quality.md asks for. The first
      # three steps are copied from that job and a guard
      # (test_agent_dispatch_toolchain_guard.py) pins that they stay equal. They
      # run on the default-branch checkout before any worker output exists and
      # hold only the read-only GITHUB_TOKEN, the same trust surface as CI's job.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      # `uv sync` puts the environment in `.venv`. On PATH, `python`, `pytest`
      # and `ruff` in the agent's shell resolve to it, so the allowlist needs no
      # `uv` entry (`uv run` would sync against a pyproject.toml / uv.lock the
      # worker can edit, i.e. install packages of its own choosing).
      - name: Put the test environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Fails the job before the model starts when the environment is missing,
      # so a broken install reaches the `escalate` job as a worker failure
      # rather than a worker that silently cannot test.
      - name: Check the test toolchain
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.prefix.endswith("/.venv"), sys.prefix'
          python -m pytest --version
          ruff --version

      - name: Run unattended worker
        id: claude
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The default GITHUB_TOKEN, read-only through the job's `permissions`
          # above. The worker needs to read the issue and the repo, nothing
          # more: every write (branch push, PR, review request, labels) is done
          # by the `publish` job as the bot with AGENT_DISPATCH_PAT, a
          # classic `repo` PAT whose rotation is tracked in #1810. That PAT is
          # never given to this job (D4).
          #
          # Assumes claude-code-action in agent mode needs no write scope of
          # its own on this token (no tracking comment, no branch creation). If
          # a run shows otherwise, the fallback is the narrowest write the
          # action asks for, not the PAT.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in
            ${{ github.repository }}, end to end, unattended. Nobody is
            watching this run — do not ask questions, make the best call
            and document it, or stop and escalate per step 5 below.

            This runner has no user-level ~/.claude layer (no SOUL.md,
            no DOCTRINE.md, no memory tools) — only this repo's own
            AGENTS.md / .claude/settings.json are in scope
            (decision a2d10d70-1282-45e1-a8be-b6bdbda92fa4). Read AGENTS.md
            first and follow its process rules as the sole instruction
            layer for this run.

            This run has READ-ONLY access to GitHub: you cannot push,
            open a PR, comment, or edit labels, and must not try. A later
            job publishes your work from two files you leave in
            `lane-out/` (already created, git-ignored).

            1. `gh issue view ${{ github.event.issue.number }} --json
               title,body,labels,milestone` — read the full issue body,
               including any `## Decisions` / `## Plan` section.
            2. Preflight per AGENTS.md: confirm nobody already claimed this
               issue (assignee, an open PR, an existing
               `claude/issue-${{ github.event.issue.number }}-*` branch).
               The intake job already set `status:in-progress` for this
               run; that label is not a claim by someone else. If claimed,
               stop and do nothing.
            3. Branch from `${{ github.event.repository.default_branch }}`:
               `claude/issue-${{ github.event.issue.number }}-<slug>`.
            4. Implement every acceptance-criteria bullet. Before
               committing run `ruff check .`, `ruff format --check .` and
               `python -m pytest tests/ -q`; fix failures before moving
               on. The Python environment is already installed from the
               lockfile and on PATH, and you cannot install packages: a
               missing dependency is a step-5 blocker. Every test you add
               or change gets the mutation probe that
               `docs/reference/test-quality.md` describes, and the
               `<production file>:<line> <mutation> → <tests> red` line
               goes in the Testing section.
            5. If genuinely blocked — ambiguous scope, an acceptance
               criterion contradicts the codebase, or the change needs a
               human decision — do NOT guess. Write the specific blocker
               to `lane-out/escalation.md`, make no commits, and stop.
            6. Otherwise commit on your branch — do not push — and write
               the PR description to `lane-out/pr-body.md`: every section
               of `.github/PULL_REQUEST_TEMPLATE.md` filled in, the
               Testing section holding what
               `docs/reference/test-quality.md` asks for, a line
               `Closes #${{ github.event.issue.number }}` on its own, and
               a line `Risk: LOW|MEDIUM|HIGH|CRITICAL — <reason>` under
               the Risk Assessment heading. The risk tier decides whether
               a human is asked to review, so state it honestly.

            Never edit this workflow file, any other file under
            `.github/workflows/**`, anything under `.claude/hooks/**`, or
            `.claude/settings.json` — these are YOUR OWN execution
            environment (this job's permissions, its worker prompt, and the
            hooks that would otherwise catch a bad edit). The `claude_args`
            below already denies `Edit`/`Write` on these paths mechanically,
            so this is belt-and-suspenders, not the only backstop — but
            don't rely on that denial as an excuse to attempt the edit
            anyway. If the issue's scope requires touching one of those, or
            any file in `docs/security/agent-boundaries.md`'s
            protected-files policy, that is itself a reason to escalate per
            step 5.
          claude_args: |
            # Headless: any tool not listed here is denied outright, same
            # rationale as code-review.yml's allowlist — no human to approve
            # a mid-run permission prompt. Covers the implement loop:
            # read/search, edit, local git, `gh` reads, and this repo's
            # lint/test commands, which run from the venv the job installs
            # from the lockfile before the agent starts (#1951). No installer
            # is granted (no `pip`, `uv`, `npm`), so the worker cannot add
            # packages of its own choosing; code that `pytest` itself runs is
            # outside this list (D4), the boundary being the read-only token.
            # There is no push, `gh pr create` or `gh
            # issue edit/comment` here: the token cannot do them, and the
            # `publish` job does. CI/hook/secret config paths stay a step-5
            # escalation, never an unattended edit (mechanically Edit-denied
            # below).
            #
            # Pinned model (F3, a fixed axis of the lane's evaluation per
            # D13): without it the action follows its own default, so a change
            # of that default would silently change what a lane run measures.
            # The id is the caller's input (the model is operator config); a
            # change of it is a deliberate edit to the caller.
            --model ${{ inputs.model }}
            #
            # --max-turns 100 (#1846): the trial run (#1806, issue #1844 →
            # PR #1845) did correct, right-scoped work — 8/8 check-runs
            # green, auto-merge succeeded — and still burned 51 turns on a
            # one-line docs fix, tripping the old limit of 40.
            # `claude-code-action` checks --max-turns *after* a successful
            # result and fails the step on the overage, so that run's
            # "Run unattended worker" step read red on work that was
            # entirely correct: not a timeout (timeout-minutes: 45, actual
            # runtime ~3 minutes), just a false failure. Raising the limit
            # (rather than treating "successful result after N turns" as
            # non-fatal) is the fix: if a *trivial* task already needs 51
            # turns, 40 was never going to hold for anything harder, and the
            # next overage would be a real one — this worker's every turn is
            # a fresh `gh`/lint/test round-trip, not a single completion
            # call. Non-fatal-overage handling (catching "successful result
            # after N turns" and not failing the step) is the fallback if a
            # false red still reproduces above this ceiling. Live
            # verification that 100 actually clears the false red on a real
            # run is tracked separately in #1848 — it can't be checked from
            # this PR, since this workflow file only takes effect for future
            # `issues: labeled` runs once a caller pins a commit that has it.
            --max-turns 100
            --allowed-tools "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh label list:*),Bash(ruff check:*),Bash(ruff format:*),Bash(pytest:*),Bash(python -m pytest:*),Bash(python -m compileall:*)"
            # Mechanical backstop for the prompt's "never edit" ask above —
            # this job's own workflow/hooks/settings, plus the real T2 set
            # from `.claude/hooks/protected-files.py`, are Edit-denied here
            # so the worker can't self-modify or blind its own guard even on
            # a bad turn. Path-scoped, not a whole-tool deny, so normal
            # implementation edits elsewhere stay unaffected.
            #
            # `Edit(path)` is the only path rule Claude Code checks for
            # writes, and it covers every built-in file-editing tool (Write
            # and NotebookEdit included). A `Write(path)` rule is accepted
            # but never consulted, and only prints a startup warning, so
            # there are none here (#1976). What these rules do NOT reach is
            # a subprocess that opens files itself — a Python script under
            # `pytest`, say — so they bind the agent's own tool calls, not
            # everything that runs in its shell.
            #
            # Every path named here must exist: `tests/ci/test_workflow_denylist_paths.py` fails
            # CI on a dead entry (#1965). `scripts/secret-scanner.py`, `scripts/protected-files.py`
            # and `scripts/principal.py` were removed from this list for that reason: the first two
            # moved to `.claude/hooks/` (#1800), already covered by the `.claude/hooks/**` rule
            # above, and `principal.py` was deleted with no successor.
            #
            # The Bash entries are defense-in-depth, not the boundary:
            # `Bash(...:*)` is a literal prefix match and no finite list
            # catches every spelling. The hard boundary is the read-only
            # token (a push fails at GitHub whatever the shell types) plus,
            # in `publish`, the exact branch name it pushes. `git push` is
            # denied anyway so a wasted attempt does not burn turns.
            --disallowed-tools "Edit(./.github/workflows/**)" "Edit(./.claude/hooks/**)" "Edit(./.claude/settings.json)" "Edit(./.gitleaks.toml)" "Edit(./.pre-commit-config.yaml)" "Bash(git push:*)" "Bash(git commit --amend:*)" "Bash(git reset --hard:*)"

      # How the worker ended, read off the action's execution log: the `result`
      # entry's `subtype` (`error_max_turns` when the SDK cut it off) and
      # `num_turns`. Only `jq` runs here, over a path the action chose; the PAT
      # is not in this job and no repo script runs. Both outputs stay empty when
      # the log is absent; `lane_escalation.py` validates them before use.
      - name: Record how the worker ended
        id: ending
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          subtype=""
          turns=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            ending=$(jq -rs 'flatten | map(select(type == "object" and .type == "result")) | last // {} | "\(.subtype // "")\t\(.num_turns // "")"' "$EXECUTION_FILE" || true)
            subtype=${ending%%$'\t'*}
            turns=${ending#*$'\t'}
          fi
          {
            echo "result_subtype=${subtype}"
            echo "num_turns=${turns}"
          } >> "$GITHUB_OUTPUT"

      # Hand the worker's commits to `publish` as a bundle. Runs even when the
      # worker step failed (a timeout after the last commit still has work to
      # publish), holds no secret, and runs git with hooks off: the workspace is
      # the worker's, so nothing in it is trusted to run.
      - name: Bundle the worker's commits
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p lane-out
          base="origin/${DEFAULT_BRANCH}"
          ahead=$(git -c core.hooksPath=/dev/null rev-list --count "${base}..HEAD")
          if [ "$ahead" -gt 0 ]; then
            git -c core.hooksPath=/dev/null bundle create lane-out/work.bundle "${base}..HEAD"
          else
            echo "::notice::The worker made no commits; nothing to bundle."
          fi

      - name: Upload the hand-off
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-out
          path: lane-out/
          if-no-files-found: ignore
          retention-days: 7

  # Every GitHub write of the lane (D1, D4, D10, D14), as the bot with
  # AGENT_DISPATCH_PAT — a classic `repo` PAT, rotation tracked in #1810. Its
  # authorship is the reason it is a PAT and not GITHUB_TOKEN: commits and PRs
  # created with the default token do not trigger other workflows (GitHub's own
  # loop-prevention), so `code-review`/`pytest`/auto-merge would never fire on
  # the lane's own PR (#1805). The PAT has no `workflow` scope, so a branch that
  # touches `.github/workflows/**` is rejected at the push.
  #
  # This job never runs anything the worker wrote. It checks out the host's
  # default branch fresh (no `ref`), takes the worker's output as inert files,
  # and runs `lane_publish.py` from the pinned lane checkout: fetch the bundle into
  # exactly `claude/issue-N-<run_id>`, push that one ref, open the PR with
  # `Closes #N`, ask the operator to review only on a HIGH/CRITICAL `Risk:` line
  # (D10), and move the issue to `status:review` (D14).
  publish:
    needs: [intake, worker]
    # `always()` so a worker that timed out after committing is still
    # published; the intake output keeps a refused or skipped run out.
    if: always() && needs.intake.outputs.pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `persist-credentials: false`: the token the checkout would otherwise
      # leave in .git/config overrides the PAT credential helper, and the push
      # would go out as github-actions with no write access. Full history so
      # the bundle's prerequisite commits are present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lane's own code (scripts, `agents/`) at the lane's own commit, never
      # the host's: `job.workflow_repository` / `job.workflow_sha` name the
      # repository and commit of THIS file. A wrong value leaves `.lane-src`
      # without the script and the run step below fails with "No such file".
      - name: Check out the lane code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lane-src
          sparse-checkout: |
            .github/scripts
            agents
          persist-credentials: false

      # An empty `job.workflow_sha` would make the checkout above silently take
      # the lane repository's default branch, i.e. unpinned code. Fail instead.
      - name: Verify the lane code is at the pinned commit
        env:
          LANE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$LANE_SHA"
          test "$(git -C .lane-src rev-parse HEAD)" = "$LANE_SHA"

      # `lane_publish.py` runs git in the host workspace; the lane code sits
      # inside it, so keep it out of every `git add`.
      - name: Keep the lane code out of git
        run: echo ".lane-src/" >> .git/info/exclude

      # A worker that failed before the upload step leaves no artifact; the
      # script then finds no bundle, publishes nothing, and the no-PR step
      # below fails the run.
      - name: Download the worker's hand-off
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: lane-out
          path: lane-out

      - name: Publish the worker's branch
        id: publish
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LANE_REVIEWER: ${{ inputs.operator || github.repository_owner }}
          LANE_BOT_LOGIN: ${{ inputs.bot-login }}
        run: python3 .lane-src/.github/scripts/lane_publish.py

      # #1806 AC2: the trial run's PR must land via auto-merge, not a human
      # click. Nothing in this repo enabled auto-merge after #1796 culled the
      # 14 workflows (the old #891 enable-job went with them), so the lane
      # ran to `gh pr create` and its PR then parked forever — the third
      # clause of AC2 was unreachable by construction.
      #
      # A deterministic post-step rather than another line in the worker
      # prompt: queueing auto-merge is a fixed mechanical consequence of "a
      # PR now exists", and an LLM that drops that instruction on a bad turn
      # leaves the PR parked with no signal that anything is wrong. The
      # worker is not handed `gh pr merge` either.
      #
      # `--auto` QUEUES the merge; it does not bypass anything. GitHub holds
      # the PR until every required check on `main` (code-gate,
      # require-linked-issue, pytest, gitleaks, waiting-human-review) reports
      # green, so a HIGH/CRITICAL PR with a pending review request stays
      # queued until a human looks. What this removes is the human click
      # *after* the gates pass, which is the point of the unattended lane.
      #
      # `if: always()` so the step still runs, and still fails loudly, when the
      # publish step above did not get as far as a PR.
      #
      # No PR (the worker escalated per step 5, stopped at the step-2
      # preflight, or the publish step failed) fails the step on purpose
      # (#1927): a green run would leave the escalation with no signal at all,
      # and a red run triggers GitHub's native failed-workflow notification to
      # the triggering actor, i.e. whoever applied `agent:dispatch`. The cause
      # and the worker's note are reported on the issue by the `escalate` job
      # below (#2011); this step only keeps the run red.
      #
      # PAT, not GITHUB_TOKEN, for the same reason as the publish step: the
      # eventual merge commit lands on `main` as a normal external actor, so
      # push-triggered workflows fire on it.
      - name: Queue auto-merge on the worker's PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_PAT }}
          GH_REPO: ${{ github.repository }}
          # The exact branch `lane_publish.py` pushed. Matched whole, or with a
          # `-<slug>` suffix: a bare prefix test on "claude/issue-180" would
          # also match issue 1806's branch and silently queue the wrong PR.
          PR_BRANCH_PREFIX: claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # `gh` output is collected into a variable before awk sees it:
          # piping gh straight into an awk that `exit`s on the first match
          # SIGPIPEs gh, and `pipefail` would turn that into a spurious step
          # failure on a busy PR list.
          raw=$(gh pr list --state open --limit 100 \
                  --json number,headRefName \
                  --jq '.[] | "\(.headRefName)\t\(.number)"')
          pr=$(awk -F'\t' -v p="$PR_BRANCH_PREFIX" \
                 '$1 == p || index($1, p "-") == 1 { print $2; exit }' <<< "$raw")
          if [ -z "$pr" ]; then
            echo "::error::No PR from the worker for issue #${ISSUE_NUMBER}: it escalated, stopped at preflight, or the publish step failed. The escalate job's comment on the issue names the cause."
            exit 1
          fi
          gh pr merge "$pr" --squash --auto
          echo "::notice::Auto-merge queued on PR #${pr} (squash); merges when all required checks pass."

  # The escalation marker (#2011, D14): a run that passed intake and ended with
  # no PR on its branch (the worker escalated, crashed, timed out, ran out of
  # turns, or `publish` failed) leaves `needs-human` on the issue and one bot
  # comment with the run id, the operator @-mention (the `operator`
  # input) and either the worker's `escalation.md` or the cause. A human
  # decides, removes `needs-human`, and re-applies `agent:dispatch`; intake
  # refuses the issue until then. The issue's assignees are never touched.
  # Rules and the cause table: .github/scripts/lane_escalation.py.
  #
  # `always()` so a failed worker or publish still reaches it; the intake output
  # keeps refusals and skipped runs out. No host checkout, only the lane's own
  # pinned code: this job holds the PAT and never runs anything the worker wrote
  # (the worker's `escalation.md` is only ever read as text).
  #
  # NOT covered: a runner crash or Actions outage that kills this job before its
  # step runs leaves no label and no comment. The `ledger` job below still
  # records that run as `no-artifact`, which is how the gap shows up.
  escalate:
    needs: [intake, worker, publish]
    if: always() && needs.intake.outputs.pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The lane's own code (scripts, `agents/`) at the lane's own commit, never
      # the host's: `job.workflow_repository` / `job.workflow_sha` name the
      # repository and commit of THIS file. A wrong value leaves `.lane-src`
      # without the script and the run step below fails with "No such file".
      - name: Check out the lane code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lane-src
          sparse-checkout: |
            .github/scripts
            agents
          persist-credentials: false

      # An empty `job.workflow_sha` would make the checkout above silently take
      # the lane repository's default branch, i.e. unpinned code. Fail instead.
      - name: Verify the lane code is at the pinned commit
        env:
          LANE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$LANE_SHA"
          test "$(git -C .lane-src rev-parse HEAD)" = "$LANE_SHA"

      - name: Download the worker's hand-off
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: lane-out
          path: lane-out

      - name: Label and comment on an issue that ended without a PR
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          LANE_OPERATOR: ${{ inputs.operator }}
          LANE_BOT_LOGIN: ${{ inputs.bot-login }}
          WORKER_RESULT: ${{ needs.worker.result }}
          WORKER_RESULT_SUBTYPE: ${{ needs.worker.outputs.result_subtype }}
          WORKER_NUM_TURNS: ${{ needs.worker.outputs.num_turns }}
          # Mirror the worker job's `timeout-minutes` and `--max-turns`; a guard
          # test fails if they drift.
          WORKER_TIMEOUT_MINUTES: "45"
          WORKER_MAX_TURNS: "100"
        run: python3 .lane-src/.github/scripts/lane_escalation.py run

  # The N-run gate ledger (D13, #2012): one row per run that passed intake, as a
  # comment by the bot on the tracking issue named by the `ledger-issue` input
  # (`owner/repo#N`; empty means no ledger, and the step only warns). The row is finalised when its PR closes, by lane-close.yml.
  # Rules, columns and the tally: .github/scripts/lane_ledger.py.
  #
  # `always()` so a worker or publish failure still leaves its row, as
  # `no-artifact`; the intake output keeps refusals and runs skipped by the
  # job-level `if` out. No host checkout, only the lane's own pinned code: this
  # job holds the PAT and runs nothing the worker wrote.
  ledger:
    needs: [intake, worker, publish]
    if: always() && needs.intake.outputs.pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The lane's own code (scripts, `agents/`) at the lane's own commit, never
      # the host's: `job.workflow_repository` / `job.workflow_sha` name the
      # repository and commit of THIS file. A wrong value leaves `.lane-src`
      # without the script and the run step below fails with "No such file".
      - name: Check out the lane code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lane-src
          sparse-checkout: |
            .github/scripts
            agents
          persist-credentials: false

      # An empty `job.workflow_sha` would make the checkout above silently take
      # the lane repository's default branch, i.e. unpinned code. Fail instead.
      - name: Verify the lane code is at the pinned commit
        env:
          LANE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$LANE_SHA"
          test "$(git -C .lane-src rev-parse HEAD)" = "$LANE_SHA"

      - name: Download the worker's hand-off
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: lane-out
          path: lane-out

      - name: Add the run's ledger row
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          # The lane's own commit (D13: each row records the lane SHA), not
          # `github.sha`, which under `workflow_call` is the host's commit.
          LANE_SHA: ${{ job.workflow_sha }}
          LANE_LEDGER_ISSUE: ${{ inputs.ledger-issue }}
          # While this checkpoint issue is open, rows are `smoke` and never counted.
          LANE_LEDGER_SMOKE_ISSUE: ${{ inputs.ledger-smoke-issue }}
          LANE_BOT_LOGIN: ${{ inputs.bot-login }}
        run: python3 .lane-src/.github/scripts/lane_ledger.py add
