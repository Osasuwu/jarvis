name: Lane Red Check Watcher

# The thin caller of the lane's red-check watcher (#2011, #2013). What it does
# and its rules: lane-watch.yml and .github/scripts/lane_escalation.py. The
# trigger stays here because the workflow names are the host's.
#
# The workflows listed are the ones that own the checks named in
# `watched-checks` below: `pytest` (Tests), `gitleaks` (Gitleaks Secret
# Scanning), `require-linked-issue` (PR Body Check) and `code-gate` (Code Gate
# Verdict). A guard test pins both lists to the workflow `name:`s and to the
# required-checks block in docs/reference/github-repo-setup.md.
#
# `workflow_run` always runs the default branch's copy of this file, never the
# PR's, which is what makes it safe to hold the bot PAT here. Code Review ->
# Code Gate Verdict -> this watcher is the deepest chain: three `workflow_run`
# levels, GitHub's maximum.
#
# No `concurrency` here: the called workflow owns it (a caller group equal to
# the callee's deadlocks).
on:
  workflow_run:
    workflows:
      - Tests
      - Gitleaks Secret Scanning
      - PR Body Check
      - Code Gate Verdict
    types: [completed]

jobs:
  watch:
    permissions:
      contents: read
    uses: ./.github/workflows/lane-watch.yml
    with:
      bot-login: osasuwu-bot
      operator: ${{ vars.LANE_OPERATOR }}
      # `waiting-human-review` is left out on purpose: it is red by design while
      # a HIGH/CRITICAL PR waits for a human, which is the hold working and not
      # a failure. `risk-tier` is left out for the same reason (it holds a PR
      # until an admin human approves the head SHA).
      watched-checks: require-linked-issue,pytest,code-gate,gitleaks
    secrets:
      AGENT_DISPATCH_PAT: ${{ secrets.AGENT_DISPATCH_PAT }}
