name: Dependabot — Regenerate uv.lock

# Dependabot updates pyproject.toml/requirements.txt ranges but does not
# regenerate uv.lock. The lockfile-check job in pytest.yml then fails every
# dependabot pip PR. This workflow fires on each dependabot push, runs uv lock,
# and commits the regenerated lockfile back to the branch — turning a perpetually
# broken PR into a self-healing one.
#
# push (not pull_request_target) is intentional: push triggers carry full write
# permissions without the pull_request_target security caveats. The actor filter
# prevents circular triggers when github-actions[bot] pushes the fix commit back.

on:
  push:
    branches:
      - "dependabot/pip/**"

jobs:
  regenerate-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Regenerate root uv.lock
        run: uv lock --project .

      - name: Regenerate mcp-memory uv.lock
        run: uv lock --project mcp-memory

      - name: Commit and push if lockfiles changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock mcp-memory/uv.lock
          git diff --staged --quiet && exit 0
          git commit -m "fix(deps): regenerate uv.lock for dependabot bump [no-issue]"
          git push
