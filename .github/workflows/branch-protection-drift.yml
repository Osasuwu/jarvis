name: Branch Protection Drift

# #1998: docs/reference/github-repo-setup.md documents which App may post each required
# check; #1982 documented it without applying it, and nothing noticed for a day. This
# compares live protection on the default branch with that documented binding and goes red
# on any difference. A red scheduled run is the signal: GitHub notifies the repo's
# maintainers of failed scheduled runs.
#
# Scheduled/dispatch only: it judges the default branch's doc, and a required-check run on
# PRs would only add a check to wait for. Reads protection through the branch object, which
# any read token sees, so no admin credential is needed. Logic:
# .github/scripts/branch_protection_drift.py.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            docs/reference/github-repo-setup.md
          persist-credentials: false

      - name: Compare live protection with the documented binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/branch_protection_drift.py
