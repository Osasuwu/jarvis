name: Branch Protection Drift

# #1998: docs/reference/github-repo-setup.md documents which App may post each required
# check; #1982 documented it without applying it, and nothing noticed for a day. This
# compares live protection on the default branch with that documented binding and goes red
# on any difference. A red scheduled run is the signal: it shows in the Actions tab, and
# GitHub emails it to the user who last changed the `cron` line, if that user has Actions
# notifications on.
#
# Scheduled/dispatch only: it judges the default branch's doc, and a required-check run on
# PRs would only add a check to wait for. Reads the required checks through the branch object,
# which any read token sees. It also goes red unless force pushes and deletion of the default
# branch are confirmed blocked (#2146): this token reads ruleset rules, but not classic
# protection's flags (that needs Administration: read, which GITHUB_TOKEN cannot be given), so
# under it only the default-branch ruleset in docs/reference/github-repo-setup.md confirms them.
# Logic: .github/scripts/branch_protection_drift.py.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# An explicit `bash` runs every `run:` step with `-eo pipefail` (#2142,
# tests/ci/test_workflow_run_fail_fast.py).
defaults:
  run:
    shell: bash

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github
            docs/reference
            docs/security
            AGENTS.md
            README.md
            CONTEXT.md
            SECURITY.md
          persist-credentials: false

      - name: Compare live protection with the documented binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/branch_protection_drift.py
