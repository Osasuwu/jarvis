name: PR Body Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # An approval or a dismissal re-evaluates risk-tier without a push (#2004). The reused
  # job set means require-linked-issue re-runs too; it has no `if:` because a skipped
  # job reads as passing.
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        # D14 (#2055): the lane's machine user is named here, not in the script, so the
        # script's literals stay a bypass list that never names it (bot-bypass guard (c)).
        env:
          LANE_BOT_LOGIN: osasuwu-bot
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            const labels = (pr.labels || []).map(l => l.name);

            // Every bypass passes the check, so it leaves a notice on the run naming
            // itself (#1967) — a silent green is indistinguishable from a linked PR.
            const bypass = (name, why) => {
              core.notice(`require-linked-issue bypassed: ${name} — ${why}`);
            };

            // D14 (#2055): the lane bot gets no [no-issue] / refactor: bypass, so an agent PR
            // always links its issue. Without the login the deny rule cannot apply: fail closed.
            const laneBot = (process.env.LANE_BOT_LOGIN || '').trim().toLowerCase();
            if (!laneBot) {
              core.setFailed('require-linked-issue: LANE_BOT_LOGIN is empty; the step must set it so the D14 deny rule (#2055) can apply.');
              return;
            }

            // Bot bypass: dependabot/renovate cannot author linked issues. Paperwork-only — pytest, gitleaks, meta-tests still gate.
            const author = (pr.user && pr.user.login) || '';
            const isLaneBot = author.toLowerCase() === laneBot;
            if (author === 'dependabot[bot]' || author === 'renovate[bot]') {
              bypass('bot author', `${author} cannot author linked issues.`);
              return;
            }

            // Hotfix escape: priority:critical label bypasses the linked-issue requirement.
            if (labels.includes('priority:critical')) {
              bypass('priority:critical', 'hotfix label present.');
              return;
            }

            // Fix-inline escape (#428): the [no-issue] directive, on a body line of its
            // own or as the title's last token (the squash commit title, matching the
            // commit-msg convention in .pre-commit-config.yaml, #329). Anywhere else it
            // is prose about the marker, not the directive (#1967).
            if (!isLaneBot && (/^\s*\[no-issue\]\s*$/im.test(body) || /(?:^|\s)\[no-issue\]\s*$/i.test(title))) {
              bypass('[no-issue]', 'fix-inline drive-by per #428.');
              return;
            }

            // Refactor escape: conventional-commit `refactor:` / `refactor(scope):` title
            // bypasses the requirement. Refactors are usually structural cleanup with
            // no parent feature/bug issue; the [no-issue] marker is redundant paperwork
            // for this class. Same posture as #428 but auto-detected from title prefix.
            if (!isLaneBot && /^refactor(\([^)]*\))?:/i.test(title)) {
              bypass('refactor: title prefix', 'structural cleanup without a parent issue.');
              return;
            }

            // Linkage keywords: GitHub's closing keywords (close/closes/closed, fix/fixes/
            // fixed, resolve/resolves/resolved) auto-close on merge; refs/references LINK
            // WITHOUT closing (#1136 AC-GATE), so a partial-work PR uses `Refs #N` and
            // leaves the issue open. The leading \b keeps `prefixes #12` from reading as
            // `fixes #12` (#1967). A reference is `#N`, `owner/repo#N` or an issue URL,
            // after whitespace or a colon (`Closes: #N`) — the forms GitHub links.
            const linkRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|references?)(?::\s*|\s+)(?:#(\d+)|([\w.-]+)\/([\w.-]+)#(\d+)|https:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/issues\/(\d+))\b/gi;
            const links = new Map();
            for (const m of body.matchAll(linkRe)) {
              const [owner, name, number] = m[1]
                ? [repo.owner, repo.repo, m[1]]
                : m[4] ? [m[2], m[3], m[4]] : [m[5], m[6], m[7]];
              const ref = { owner, repo: name, issue_number: parseInt(number, 10) };
              links.set(`${owner}/${name}#${ref.issue_number}`.toLowerCase(), ref);
            }

            if (links.size === 0 && isLaneBot) {
              core.setFailed(`require-linked-issue: ${author.toLowerCase()} PRs get no [no-issue] or refactor: bypass (D14, #2055); link an issue with "Closes #N" or "Refs #N".`);
              return;
            }
            if (links.size === 0) {
              core.setFailed('PR body must include a linked issue reference (e.g. "Closes #123" to auto-close, or "Refs #123" to link a partial-work PR without closing), a [no-issue] line for trivial fix-inline drive-bys (#428), or the priority:critical label for hotfixes.');
              return;
            }

            const errors = [];
            for (const ref of links.values()) {
              try {
                await github.rest.issues.get(ref);
              } catch (e) {
                errors.push(`Linked issue ${ref.owner}/${ref.repo}#${ref.issue_number} does not exist or is not accessible.`);
              }
            }

            // Absorbed slices (#1178, #948 Mode 2): a commit headline's `(#N)` names a slice the
            // PR ships. An open same-repo issue the body does not link gets no close path, so it
            // fails; `Refs #N` is the author's statement that the ref is not an absorbed slice.
            // Closed issues and pull requests (squash titles carry PR numbers) are
            // back-references. Foreign refs only warn: a closing keyword does not reliably
            // close them. Headlines only: a commit body mention is prose.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...repo, pull_number: pr.number, per_page: 100,
            });
            const headRe = /\((?:([\w.-]+)\/([\w.-]+))?#(\d+)\)/g;
            const orphaned = [];
            const foreign = [];
            const seen = new Set();
            for (const c of commits) {
              const headline = ((c.commit && c.commit.message) || '').split('\n')[0];
              for (const m of headline.matchAll(headRe)) {
                const owner = m[1] || repo.owner;
                const name = m[2] || repo.repo;
                const n = parseInt(m[3], 10);
                const key = `${owner}/${name}#${n}`.toLowerCase();
                if (seen.has(key) || links.has(key)) continue;
                seen.add(key);
                if (owner.toLowerCase() !== repo.owner.toLowerCase() || name.toLowerCase() !== repo.repo.toLowerCase()) {
                  foreign.push(`${owner}/${name}#${n}`);
                  continue;
                }
                let data;
                try {
                  ({ data } = await github.rest.issues.get({ ...repo, issue_number: n }));
                } catch (e) {
                  // A dangling (#N) (404) is not a slice this PR can close. Any other error says
                  // nothing about the ref, so fail closed rather than pass on an outage.
                  if (e.status === 404) continue;
                  errors.push(`require-linked-issue: could not read commit-headline issue #${n} (HTTP ${e.status || 'error'}); re-run the check.`);
                  continue;
                }
                if (data.state === 'open' && !data.pull_request) orphaned.push(`#${n}`);
              }
            }
            if (foreign.length > 0) {
              core.warning(`require-linked-issue: commit headlines reference issue(s) in another repo: ${foreign.join(', ')}. A closing keyword does not reliably close a foreign issue; close it by hand if this PR ships it (docs/reference/pr-issue-linkage.md).`);
            }
            if (orphaned.length > 0) {
              errors.push(`require-linked-issue: commit headlines reference open issue(s) the PR body does not link: ${orphaned.join(', ')}. If the PR ships an issue's whole scope, add a closing line ("Closes #N") for it; if the reference is not an absorbed slice, link it with "Refs #N" (docs/reference/pr-issue-linkage.md, #1178).`);
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }

  # The `risk-tier` required check (#2004; grammar and rules: .github/scripts/risk_tier.md).
  # No `name:` key: the check context is the job id, which branch protection binds.
  # Trusted execution: only the PR's *base* branch is checked out and run, so a PR cannot
  # shorten the protected-path list or loosen the classifier it is judged by. The PR is
  # read through the API as data. Not pull_request_target (D11/D11b).
  risk-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: risk-tier-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .github/scripts
            agents
            config
            scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.3
      - run: |
          if [ ! -f .github/scripts/risk_tier.py ]; then
            echo "::error::risk-tier: the base branch has no .github/scripts/risk_tier.py (a PR based on a branch that predates #2004). Rebase onto main."
            exit 1
          fi
          python .github/scripts/risk_tier.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # PR1 of #2013 runs the classifier from the base checkout itself, so code root
          # and host root are the same tree; the next change replaces these steps with
          # the pinned `.github/actions/risk-tier` action.
          RISK_TIER_HOST_ROOT: ${{ github.workspace }}
          LANE_BOT_LOGIN: osasuwu-bot
