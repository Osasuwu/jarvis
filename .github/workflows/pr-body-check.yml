name: PR Body Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # An approval or a dismissal re-evaluates risk-tier without a push (#2004). The reused
  # job set means require-linked-issue re-runs too; it has no `if:` because a skipped
  # job reads as passing.
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            const labels = (pr.labels || []).map(l => l.name);

            // Bot bypass: dependabot/renovate cannot author linked issues. Paperwork-only — pytest, gitleaks, meta-tests still gate.
            const author = (pr.user && pr.user.login) || '';
            if (author === 'dependabot[bot]' || author === 'renovate[bot]') {
              console.log(`bot author (${author}) — skipping linked-issue requirement.`);
              return;
            }

            // Hotfix escape: priority:critical label bypasses the linked-issue requirement.
            // Aligns with issue-checks.yml which treats priority:critical as hotfix.
            if (labels.includes('priority:critical')) {
              console.log('priority:critical label present — skipping linked-issue requirement (hotfix).');
              return;
            }

            // Fix-inline escape: [no-issue] marker bypasses the requirement.
            // Checked in both body and title — mirrors the commit-msg convention in
            // .pre-commit-config.yaml (#329) where the marker lives in the commit title.
            // Matches AGENTS.md "Fix > track for trivial reversible (#428)" — drive-by
            // fixes shouldn't require filing a tracker just to satisfy paperwork.
            if (/\[no-issue\]/i.test(body) || /\[no-issue\]/i.test(title)) {
              console.log('[no-issue] marker present — skipping linked-issue requirement (fix-inline per #428).');
              return;
            }

            // Refactor escape: conventional-commit `refactor:` / `refactor(scope):` title
            // bypasses the requirement. Refactors are usually structural cleanup with
            // no parent feature/bug issue; the [no-issue] marker is redundant paperwork
            // for this class. Same posture as #428 but auto-detected from title prefix.
            if (/^refactor(\([^)]*\))?:/i.test(title)) {
              console.log('refactor: title prefix — skipping linked-issue requirement.');
              return;
            }

            // Linkage keywords: closing keywords (closes/fixes/resolves) auto-close on
            // merge; refs/references LINK WITHOUT closing (#1136 AC-GATE). A partial-work
            // PR uses `Refs #N` to satisfy this gate while leaving the issue open. Auto-close
            // is driven by closingIssuesReferences only, so `Refs` links-without-closing by
            // construction.
            const issueMatches = [...body.matchAll(/(?:closes|fixes|resolves|refs?|references?)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(issueMatches.map(m => parseInt(m[1], 10)))];

            if (issueNumbers.length === 0) {
              core.setFailed('PR body must include a linked issue reference (e.g. "Closes #123" to auto-close, or "Refs #123" to link a partial-work PR without closing), the [no-issue] marker for trivial fix-inline drive-bys (#428), or the priority:critical label for hotfixes.');
              return;
            }

            const errors = [];
            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.get({
                  ...repo,
                  issue_number: issueNumber,
                });
              } catch (e) {
                errors.push(`Linked issue #${issueNumber} does not exist or is not accessible.`);
              }
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }

  # The `risk-tier` required check (#2004; grammar and rules: .github/scripts/risk_tier.md).
  # No `name:` key: the check context is the job id, which branch protection binds.
  # Trusted execution: only the PR's *base* branch is checked out and run, so a PR cannot
  # shorten the protected-path list or loosen the classifier it is judged by. The PR is
  # read through the API as data. Not pull_request_target (D11/D11b).
  risk-tier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: risk-tier-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .github/scripts
            agents
            config
            scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.3
      - run: python .github/scripts/risk_tier.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
