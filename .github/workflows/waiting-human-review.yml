name: Waiting for human review

# #1892: a merge hold that reads the same at any team size. At N>1 a pending
# review request carries it; at one developer a review cannot be requested
# from oneself, so the `waiting-human-review` label carries the same hold
# instead. Required as of #1893, which also retired the `status:owner-queue`
# label this check replaced.
#
# #1999 AP5: the AFK worker is the machine user `osasuwu-bot` with write access,
# so it can remove the label or a review request. The decision lives in
# `.github/scripts/waiting_human_review.py`: a hold released by the bot (or any
# `*[bot]` actor) is not a release, the label goes back on and the check stays
# red until a human releases it. The script is checked out from the BASE ref:
# the bot PAT can push `.github/scripts/**` on its branch but not
# `.github/workflows/**`, so a PR must not run its own copy of this gate. A
# label added with the workflow GITHUB_TOKEN starts no workflow, so the
# re-apply cannot loop.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - review_requested
      - review_request_removed
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted

jobs:
  waiting-human-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f .github/scripts/waiting_human_review.py ]; then
            echo "::error::the base ref has no .github/scripts/waiting_human_review.py; merge the PR that adds it, then re-run"
            exit 1
          fi
          python3 .github/scripts/waiting_human_review.py
