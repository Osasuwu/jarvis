name: Lane Ledger Close

# The thin caller that finalises a lane PR's N-run gate ledger row when the PR
# closes (D13, #2012, #2013): `merged-unedited` is `human-touched: no` (no commit,
# comment or non-approving review by anyone but the lane bot or a `*[bot]` login).
# What it does: lane-close.yml and .github/scripts/lane_ledger.py.
#
# `pull_request_target`, not `pull_request`: the called job holds the bot PAT,
# and a `pull_request` run would execute the PR's own copy of the workflow with
# it. Here the workflow is the default branch's, so the code that runs is never
# the PR's.
on:
  pull_request_target:
    types: [closed]

jobs:
  finalise:
    permissions:
      contents: read
    uses: ./.github/workflows/lane-close.yml
    with:
      bot-login: osasuwu-bot
      ledger-issue: ${{ vars.LANE_LEDGER_ISSUE }}
    secrets:
      AGENT_DISPATCH_PAT: ${{ secrets.AGENT_DISPATCH_PAT }}
