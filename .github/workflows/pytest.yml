name: Tests

# Runs the full pytest suite on every PR + push to main.
# Closes the reviewer blind spot from #471: the code-review plugin's rubric
# silences "broken tests" findings under the assumption CI catches them, but
# until this workflow shipped, only `tests/ci/` ran in CI (`ci-meta.yml`).
# Now the assumption holds — broken tests in `tests/` fail PRs visibly.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Check root uv.lock is in sync with pyproject.toml
        run: uv lock --check

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest tests/ -v
