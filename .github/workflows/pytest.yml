name: Tests

# Runs the full pytest suite on every PR + push to main.
# Closes the reviewer blind spot from #471: the code-review plugin's rubric
# silences "broken tests" findings under the assumption CI catches them, but
# until this workflow shipped, only `tests/ci/` ran in CI (`ci-meta.yml`).
# Now the assumption holds — broken tests in `tests/` fail PRs visibly.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Check root uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Check mcp-memory uv.lock is in sync with requirements
        run: uv lock --project mcp-memory --check

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest tests/ -v

  # DB-gated integration tests (issue #975). Without a real Postgres the
  # advancer's FOR UPDATE SKIP LOCKED / ON CONFLICT dedup / interval arithmetic
  # were never exercised in CI — the DB-gated tests in
  # tests/reactive_core/test_global_task_advancer.py silently skipped. This job stands up a
  # Postgres service, bootstraps the schema, and runs ONLY that file with
  # DATABASE_URL set so those tests actually run.
  #
  # Why only that one file (not `tests/`): setting DATABASE_URL globally would
  # un-skip OTHER DB-gated tests across the suite whose tables this job does not
  # bootstrap — turning their clean skips into failures. Keep the DB job scoped.
  #
  # REQUIRE_DB=1 makes the db_connection fixture FAIL (not skip) if DATABASE_URL
  # is ever missing here, so a future change that drops the service can't quietly
  # revert to the silent-skip blind spot this issue closes.
  pytest-db:
    runs-on: ubuntu-latest
    # Bound the job: a hung Postgres health-check or a deadlocked SKIP LOCKED
    # test should fail fast, not idle until the org-wide 6h ceiling (m2, #975).
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      - name: Bootstrap global-task schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/ci/global_task_schema_bootstrap.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260615120000_create_global_task_sources.sql

      - name: Run DB-gated advancer tests
        env:
          REQUIRE_DB: "1"
        run: uv run pytest tests/reactive_core/test_global_task_advancer.py -v -rs

  # DB-gated find_consolidation_clusters tests (#1187). The rewritten RPC
  # (supabase/migrations/20260715130000_rewrite_find_consolidation_clusters.sql)
  # is plpgsql running inside Postgres itself — HNSW LATERAL probes, temp-table
  # label propagation, cap-10 truncation — none of which a pure-Python unit
  # test can exercise. This job stands up pgvector, bootstraps a minimal
  # `memories` table, applies the REAL migration, and runs the RPC against
  # synthetic rows so partition isolation / transitive merge / truncation /
  # dead-row exclusion actually get verified in CI.
  pytest-db-pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      - name: Bootstrap pgvector schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/ci/pgvector_schema_bootstrap.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260715130000_rewrite_find_consolidation_clusters.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260812130000_add_merge_section_into_memory_rpc.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260825170000_fix_merge_section_soft_delete_revival.sql

      - name: Run DB-gated consolidation-cluster tests
        env:
          REQUIRE_DB: "1"
        run: uv run pytest tests/memory/test_find_consolidation_clusters_db.py -v -rs

      - name: Run DB-gated merge_section RPC tests
        env:
          REQUIRE_DB: "1"
        run: uv run pytest tests/memory/test_merge_section_rpc_db.py -v -rs

  # DB-gated task_queue.enqueue() issue_number CAS tests (#1085 S1-3). The
  # partial unique index on issue_number (scoped to non-terminal rows) is
  # real Postgres constraint-enforcement logic — a stub cannot prove that a
  # different-idempotency-key, same-issue_number row on a still-pending/
  # claimed/running task actually collides while a terminal one does not.
  # This job stands up Postgres, bootstraps the pre-#1085 task_queue shape,
  # applies the REAL migration, and runs enqueue() against it.
  pytest-db-task-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install package + extras from lockfile
        run: uv sync --all-extras

      - name: Bootstrap task_queue schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/ci/task_queue_schema_bootstrap.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260811163000_add_task_queue_issue_number.sql

      - name: Run DB-gated task_queue issue_number tests
        env:
          REQUIRE_DB: "1"
        run: uv run pytest tests/reactive_core/test_task_queue_issue_number_db.py -v -rs
