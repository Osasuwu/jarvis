name: Code Gate Verdict

# Decides the `code-gate` check from review EVIDENCE. Rule: "Review evidence" —
# docs/reference/github-repo-setup.md §3; logic: .github/scripts/code_gate_verdict.py.
#
# Runs from the DEFAULT BRANCH (`pull_request_target`, `workflow_run` and
# `schedule` all resolve the workflow file there) and never checks out PR code:
# the only thing checked out is `.github/scripts` at the default branch. A PR
# cannot change the rule that judges it. PR-controlled values reach steps
# through `env:` only.
#
# `code-gate` is posted by the `osasuwu-ci` GitHub App (branch protection binds
# the check to that app_id), so no other workflow can satisfy the gate by
# creating a same-named check. The App key lives in the `code-gate-verdict`
# environment, restricted to deployments from the default branch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Re-run hook: evidence landing after the first evaluation re-decides the SHA.
  workflow_run:
    workflows: ["Code Review"]
    types: [completed]
  # Daily sweep: review evidence expires after 90 days and nothing fires on the PR
  # when it does, so every open PR into the default branch is re-decided once a
  # day (#2079). GitHub may start a schedule late, and disables it in a public
  # repo with no activity for 60 days.
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # Emits `targets`, a JSON list of {pr_number, head_sha}. On an event it parses
  # event data only, no network; `[]` means the event is not bound to a PR (e.g. a
  # fork's `pull_request` run, whose `pull_requests[]` is empty) and nothing
  # follows. On the schedule it lists the open PRs into the default branch with
  # the read-only GITHUB_TOKEN; too many, or a listing cut at its page cap, fails
  # this job and sweeps none. No environment, no App key.
  resolve:
    # `edited` fires on every title/body edit; only a base-branch change alters
    # the evaluation.
    if: github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      # Base-pinned: default branch, scripts only. Never the PR head. A schedule's
      # own ref is the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve PR and head SHA
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Read only: the schedule's open-PR listing (#2079).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I .github/scripts/code_gate_verdict.py resolve

  verdict:
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # One job per resolved (PR, SHA): an event's one, or every open PR on the
    # schedule. One PR's failure does not cancel the others' verdicts.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    # Serialize per (PR, SHA) without cancelling: a verdict that is mid-post must
    # finish, and the next event for the same SHA simply re-decides it.
    concurrency:
      group: code-gate-${{ matrix.target.pr_number }}-${{ matrix.target.head_sha }}
      cancel-in-progress: false
    environment: code-gate-verdict
    steps:
      # agents/ + config/: the gate set is the base's protected list, read through
      # agents/path_policy.py (#2067).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            agents
            config
          persist-credentials: false

      - name: Mint osasuwu-ci installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Decide and post code-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_TOKEN: ${{ steps.app.outputs.token }}
          GATE_APP_ID: ${{ secrets.GATE_APP_ID }}
          PR_NUMBER: ${{ matrix.target.pr_number }}
          HEAD_SHA: ${{ matrix.target.head_sha }}
        run: python -I .github/scripts/code_gate_verdict.py verdict
