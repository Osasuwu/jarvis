name: Agent Dispatch

# The thin caller of the AFK lane (#2013, D2). All lane logic (intake, worker,
# publish, escalation, ledger row), its `agent:dispatch` label filter and its
# per-host-repo concurrency group (D15, F7) live in lane.yml. This file holds
# only what is the host's: the trigger, the bot identity, the model, the
# operator inputs and the two secrets, passed by name.
#
# Declare no `concurrency` here, at workflow or job level: the group is
# lane.yml's, and a caller group equal to the callee's deadlocks the run.
#
# `uses:` is a same-commit local ref while lane.yml is being introduced; the
# next change pins it, here and in the other lane callers, to
# `Osasuwu/jarvis/.github/workflows/lane.yml@<sha>` (a commit already on the
# default branch). Host setup and the pin procedure: docs/reference/lane-host-setup.md.
on:
  issues:
    types: [labeled]

jobs:
  lane:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/lane.yml
    with:
      bot-login: osasuwu-bot
      bot-email: 339131200+osasuwu-bot@users.noreply.github.com
      model: claude-sonnet-5-5
      class2-afk: true
      operator: ${{ vars.LANE_OPERATOR }}
      ledger-issue: ${{ vars.LANE_LEDGER_ISSUE }}
      ledger-smoke-issue: ${{ vars.LANE_LEDGER_SMOKE_ISSUE }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_DISPATCH_PAT: ${{ secrets.AGENT_DISPATCH_PAT }}
