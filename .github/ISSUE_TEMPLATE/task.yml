name: "Task"
description: "Atomic work item that results in one PR."
labels: ["task", "status:ready"]
body:
  - type: input
    id: parent
    attributes:
      label: "Parent Epic"
      description: "Optional reference only. Primary linkage must be set via GitHub Parent issue/Sub-issues UI."
      placeholder: "#42 (optional note)"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What needs to be done?"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "area:skills"
        - "area:config"
        - "area:infrastructure"
        - "area:quality"
        - "area:docs"
        - "area:core-agent"
        - "area:ci-quality"
        - "area:memory"
        - "area:security"
        - "area:release"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "priority:critical"
        - "priority:high"
        - "priority:medium"
        - "priority:low"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "One checkbox per observable outcome, each literally verifiable. State what must be true, not which tests to write."
      value: |
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: "Size Estimate"
      options:
        - "S (< 1h)"
        - "M (1-4h)"
        - "L (4-8h)"
        - "XL (> 8h — consider splitting)"
    validations:
      required: false
